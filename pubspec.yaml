name: macau_bus_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.5.5
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.0
  provider: ^6.1.2
  google_mobile_ads: ^9.1.0
  flutter_background_service: ^5.1.0
  cached_network_image: ^3.4.1
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  # 確保系統能讀取 assets 資料夾內嘅圖片
  assets:
    - assets/

# 👇 統一嘅圖示生成設定 (只用 .png)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256